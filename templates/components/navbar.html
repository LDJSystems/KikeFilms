<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm sticky-top">

            <i class="bi bi-film me-2"></i>KikeFilms
        </a>

        <!-- Botón responsive para móviles -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#kikeNavbar"

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Elementos del menú -->
        <div class="collapse navbar-collapse" id="kikeNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <a class="nav-link" href="{% url 'listar_peliculas' %}">Cartelera</a>

                        <i class="bi bi-plus-circle me-1"></i>+ Añadir Película
                    </a>
                </li>
                {% endif %}
            </ul>
